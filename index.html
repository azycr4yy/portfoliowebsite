document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    const templateData = JSON.parse(templateEl.textContent);
    const pages = templateData.pages;
    const entryId = templateData.entry;
    const pageIds = Object.keys(pages);

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : {};

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    // Per-page prep: substitute UUIDs, strip SRI/crossorigin (blob URLs from a
    // file:// document inherit a null origin, so crossorigin forces a CORS
    // fetch that SRI then rejects — the manifest bytes are ours; SRI protects
    // against CDN compromise, not this), and inject the page's own
    // window.__resources + the click interceptor into <head>. slice() rather
    // than replace() keeps us clear of $-pattern substitution.
    function resourcesFor(id) {
      var map = {};
      var list = extResources[id] || [];
      for (var k = 0; k < list.length; k++) {
        if (blobUrls[list[k].uuid]) map[list[k].id] = blobUrls[list[k].uuid];
      }
      return map;
    }
    for (const id of pageIds) {
      let t = pages[id];
      for (const uuid of uuids) t = t.split(uuid).join(blobUrls[uuid]);
      t = t.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      // a blanket <base target="_parent"> would also redirect form submissions
      // and tear down the wrapper. Non-# links navigate the parent to the
      // anchor's resolved href; #/… routes forward to the parent's hash only
      // when the id is one of this bundle's own pages (author #/… links from
      // an in-page hash router are left to the scroll path so they don't yank
      // the user to the entry page); plain #frag scrolls in place.
      // composedPath + getAttribute('target') handle SVG <a> and shadow-DOM
      // anchors, which closest()/IDL .target get wrong.
      var headContent = 'window.__resources = ' + JSON.stringify(resourcesFor(id)) + ';' +
        (pageIds.length > 1 ?

            'var a = null, p = e.composedPath ? e.composedPath() : [e.target];' +

            'if (!a || a.hasAttribute("download")) return;' +
            'var tg = a.getAttribute("target");' +
            'if (tg && tg !== "_self") return;' +
            'var h = a.getAttribute("href") || a.getAttribute("xlink:href");' +
            'if (!h || /^javascript:/i.test(h)) return;' +
            'if (h.charAt(0) !== "#") {' +
              'if (!tg) { var b = document.querySelector("base[target]"); if (b && b.getAttribute("target") !== "_self") return; }' +
              'e.preventDefault();' +
              'if (/^(?:[a-z][a-z0-9+.-]*:|\\/\\/)/i.test(h)) parent.location.assign(h);' +
              'return;' +
            '}' +
            'e.preventDefault();' +
            'if (h.slice(0, 2) === "#/") {' +
              'var c = h.indexOf(":", 2);' +
              'var pid = c < 0 ? h.slice(2) : h.slice(2, c);' +
              'try { pid = decodeURIComponent(pid); } catch(err) {}' +
              'if (window.__bundler_pages.indexOf(pid) >= 0) { parent.location.hash = h; return; }' +
            '}' +
            'var t = h.length > 1 ? document.getElementById(h.slice(1)) : null;' +
            'if (t) t.scrollIntoView({behavior:"smooth"});' +
            'else scrollTo({top:0, behavior:"smooth"});' +
          '});' : '');
      // Defuse any script end-tag sequence in the content (resource ids, page
      // ids) before wrapping — same escape level as every sibling JSON island.
      var headScript = '<script>' +
        headContent.split('</' + 'script').join('<\\/' + 'script') +
        '</' + 'script>';
      // Inject after <head> so the DOCTYPE stays first; prepending the script
      // would push the parser into quirks mode. DOMParser always emits a <head>
      // (synthesizing one if the source HTML omitted it) but may carry
      // attributes through, so match the full opening tag.
      var headOpen = t.match(/<head[^>]*>/i);
      if (headOpen) {
        var hi = headOpen.index + headOpen[0].length;
        t = t.slice(0, hi) + headScript + t.slice(hi);
      }
      pages[id] = t;
    }

    setStatus('Rendering...');

    if (pageIds.length === 1) {
      // Single page: the pre-crawl render path. Parse the template and swap the
      // root element. Scripts inserted via DOMParser/replaceWith are inert per
      // spec — re-create each with createElement so they execute, awaiting
      // onload for src scripts to preserve ordering (React before ReactDOM
      // before Babel before text/babel).
      var template = pages[entryId];
      const doc = new DOMParser().parseFromString(template, 'text/html');
      document.documentElement.replaceWith(doc.documentElement);
      const dead = Array.from(document.scripts);
      for (const old of dead) {
        const s = document.createElement('script');
        for (const a of old.attributes) s.setAttribute(a.name, a.value);
        s.textContent = old.textContent;
        // text/babel scripts with a src: fetch and inline. transformScriptTags
        // does XHR against the src, but blob:null/ from a file:// origin is
        // silently dropped. Inlining makes it a plain inline babel script,
        // which transformScriptTags handles unconditionally.
        if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
          try {
            const r = await fetch(s.src);
            s.textContent = await r.text();
            s.removeAttribute('src');
          } catch (e) {}
        }
        // Non-executable script types (text/babel, application/json, …) are
        // data blocks per spec: the browser never fetches src and never fires
        // load/error, so awaiting would hang forever.
        const exec = !s.type || s.type === 'module' || /(java|ecma)script/i.test(s.type);
        const p = (s.src && exec) ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
        old.replaceWith(s);
        if (p) await p;
      }
      // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
      // which fired before we swapped the document. Trigger manually if present.
      if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
        window.Babel.transformScriptTags();
      }
      return;
    }

    // Multi-page: render into a full-viewport srcdoc iframe so each page runs
    // in its own realm while staying same-origin with the parent (so asset
    // blob URLs load and parent.location is writable).
    var frame = document.createElement('iframe');
    frame.id = '__bundler_frame';
    frame.setAttribute('style', 'position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff');
    document.body.appendChild(frame);

    function decode(s) {
      try { return decodeURIComponent(s); } catch (e) { return s; }
    }
    function route() {
      var h = (location.hash || '');
      if (h.slice(0, 2) !== '#/') return { id: entryId, anchor: '' };
      h = h.slice(2);
      var i = h.indexOf(':');
      return i < 0 ? { id: decode(h), anchor: '' }
                   : { id: decode(h.slice(0, i)), anchor: decode(h.slice(i + 1)) };
    }

    var current = null;
    var navGen = 0;
    function navigate() {
      var r = route();
      var id = Object.prototype.hasOwnProperty.call(pages, r.id) ? r.id : entryId;
      if (current === id) {
        // Same-page anchor change: the iframe's own hash handles this, so
        // normally we don't reach here. If we do (e.g. a programmatic
        // parent.location.hash change), nudge the iframe.
        var cw = frame.contentWindow;
        if (!cw) return;
        var el = r.anchor && cw.document.getElementById(r.anchor);
        if (el) el.scrollIntoView({ behavior: 'smooth' });
        else cw.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }
      current = id;
      var gen = ++navGen;
      frame.onload = function() {
        // One-shot: an iframe-internal navigation (form submit, page JS
        // location.href=) re-fires onload with the same gen; after that the
        // iframe may be cross-origin, and cw.* access would throw.
        frame.onload = null;
        if (gen !== navGen) return;
        var cw = frame.contentWindow;
        try { cw.document.title && (document.title = cw.document.title); } catch (e) {}
        var splash = document.getElementById('__bundler_thumbnail') ||
                     document.getElementById('__bundler_placeholder');
        if (splash) splash.remove();
        if (loading) loading.remove();
        var el = r.anchor && cw.document.getElementById(r.anchor);
        if (el) el.scrollIntoView();
        else cw.scrollTo(0, 0);
      };
      frame.srcdoc = pages[id];
    }

    window.addEventListener('hashchange', navigate);
    navigate();
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

flex-direction: column; gap: 3px; min-width: 0; flex: 1;\">\n          <span style=\"font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase; color: #9a9488; font-weight: 300;\">LinkedIn<\u002Fspan>\n          <span style=\"font-size: 15px; color: #1c1a16;\">in/udayan-j<\u002Fspan>\n        <\u002Fspan>\n        <span style=\"font-size: 15px; color: #b0a898; flex-shrink: 0;\">↗<\u002Fspan>\n      <\u002Fa>\n      <!-- Location -->\n      <div style=\"display: flex; align-items: center; gap: 20px; background: #faf9f6; border: 0.5px solid rgba(26,24,22,0.12); padding: 24px 26px;\">\n        <span style=\"display: flex; align-items: center; justify-content: center; width: 46px; height: 46px; border-radius: 50%; border: 1px solid rgba(26,24,22,0.2); flex-shrink: 0;\">\n          <svg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#6b6158\" stroke-width=\"1.3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 21c4.5-4.2 7-7.4 7-10.5a7 7 0 1 0-14 0C5 13.6 7.5 16.8 12 21z\"><\u002Fpath><circle cx=\"12\" cy=\"10.3\" r=\"2.3\"><\u002Fcircle><\u002Fsvg>\n        <\u002Fspan>\n        <span style=\"display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1;\">\n          <span style=\"font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase; color: #9a9488; font-weight: 300;\">Based in<\u002Fspan>\n          <span style=\"font-size: 15px; color: #1c1a16;\">Manipal, Rajasthan · India<\u002Fspan>\n        <\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Résumé download -->\n    <div style=\"margin-top: 44px; display: flex; align-items: center; gap: 24px; flex-wrap: wrap;\">\n      <a href=\"#\" download=\"\" style=\"display: inline-flex; align-items: center; gap: 12px; background: #1c1a16; color: #f5f1e8; padding: 17px 40px; font-size: 11px; letter-spacing: 0.28em; text-transform: uppercase; font-weight: 400; border: 1px solid #1c1a16; transition: background 0.28s, color 0.28s; font-family: 'Cormorant Garamond', Georgia, serif;\" style-hover=\"background: transparent; color: #1c1a16;\">\n        Download Résumé ↓\n      <\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════════════════ FOOTER ═══════════════════ -->\n<footer data-screen-label=\"Footer\" style=\"background: #0d0c0b; padding: clamp(40px, 9vw, 52px) clamp(24px, 6vw, 56px); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 24px;\">\n  <div>\n    <div style=\"font-family: 'Cormorant SC', Georgia, serif; font-size: 13px; font-weight: 500; letter-spacing: 0.28em; color: #9a9488; margin-bottom: 6px;\">Udayan Joshi<\u002Fdiv>\n    <div style=\"font-size: 11px; letter-spacing: 0.18em; color: #3a3530; text-transform: uppercase; font-weight: 300;\">Software Engineer · Manipal University<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display: flex; gap: 34px; align-items: center; flex-wrap: wrap;\">\n    <a href=\"mailto:udayanjoshi12@gmail.com\" style=\"font-size: 11px; letter-spacing: 0.2em; color: #3a3530; text-transform: uppercase; font-weight: 300; transition: color 0.2s;\" style-hover=\"color: #9a9488;\">Email<\u002Fa>\n    <a href=\"https://github.com/azycr4yy\" target=\"_blank\" style=\"font-size: 11px; letter-spacing: 0.2em; color: #3a3530; text-transform: uppercase; font-weight: 300; transition: color 0.2s;\" style-hover=\"color: #9a9488;\">GitHub<\u002Fa>\n    <a href=\"https://www.linkedin.com/in/udayan-j-4034b0368\" target=\"_blank\" style=\"font-size: 11px; letter-spacing: 0.2em; color: #3a3530; text-transform: uppercase; font-weight: 300; transition: color 0.2s;\" style-hover=\"color: #9a9488;\">LinkedIn<\u002Fa>\n  <\u002Fdiv>\n  <div style=\"font-size: 10px; letter-spacing: 0.14em; color: #1e1c18; font-weight: 300;\">© 2026<\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\n\nclass Component extends DCLogic {\n  state = {\n    scrollY: 0,\n    face: 'front',    // 'front' | 'back'\n    flipPhase: 0,     // 0=idle, 1=to-edge, 2=swap-instant, 3=from-edge\n    mouseX: 0,\n    mouseY: 0,\n    isHovered: false,\n    wH: 800,\n    wW: 1440,\n    menuOpen: false,\n    sv: { about: false, projects: false, resume: false, contact: false }\n  };\n\n  _el = null;\n  _ob = null;\n\n  componentDidMount() {\n    this.setState({ wH: window.innerHeight, wW: window.innerWidth });\n    window.addEventListener('scroll', this._scroll, { passive: true });\n    window.addEventListener('resize', this._resize, { passive: true });\n\n    this._ob = new IntersectionObserver(entries => {\n      const u = {};\n      entries.forEach(e => {\n        if (e.isIntersecting && e.target.dataset.section) u[e.target.dataset.section] = true;\n      });\n      if (Object.keys(u).length) this.setState(s => ({ sv: { ...s.sv, ...u } }));\n    }, { threshold: 0.07 });\n    ['about','projects','resume','contact'].forEach(id => {\n      const el = document.getElementById(id);\n      if (el) this._ob.observe(el);\n    });\n\n    // Fallback: reveal all sections after 2.5s\n    setTimeout(() => {\n      this.setState(s => ({ sv: { about: true, projects: true, resume: true, contact: true, ...s.sv } }));\n    }, 2500);\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener('scroll', this._scroll);\n    window.removeEventListener('resize', this._resize);\n    if (this._ob) this._ob.disconnect();\n  }\n\n  _scroll = () => this.setState({ scrollY: window.scrollY });\n  _resize = () => this.setState({ wH: window.innerHeight, wW: window.innerWidth });\n\n  onMM = (e) => {\n    if (!this._el || this.state.flipPhase !== 0) return;\n    const r = this._el.getBoundingClientRect();\n    const x = (e.clientX - r.left - r.width / 2) / (r.width / 2);\n    const y = (e.clientY - r.top - r.height / 2) / (r.height / 2);\n    this.setState({\n      mouseX: Math.max(-1, Math.min(1, x)),\n      mouseY: Math.max(-1, Math.min(1, y)),\n      isHovered: true\n    });\n  };\n\n  onML = () => this.setState({ mouseX: 0, mouseY: 0, isHovered: false });\n\n  // JS half-flip swap: rotate to edge → swap content → rotate back\n  flip = () => {\n    if (this.state.flipPhase !== 0) return;\n    // Phase 1: rotate to 90° (edge-on)\n    this.setState({ flipPhase: 1 });\n    setTimeout(() => {\n      // Phase 2: swap face + jump to −90° (invisible since edge-on, no transition)\n      this.setState(s => ({\n        face: s.face === 'front' ? 'back' : 'front',\n        flipPhase: 2\n      }));\n      // Phase 3: animate from −90° back to 0° (new face reveals)\n      setTimeout(() => {\n        this.setState({ flipPhase: 3 });\n        setTimeout(() => this.setState({ flipPhase: 0 }), 320);\n      }, 20);\n    }, 320);\n  };\n\n  onKD = (e) => {\n    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); this.flip(); }\n  };\n\n  setRef = (el) => { this._el = el; };\n\n  toggleMenu = () => this.setState(s => ({ menuOpen: !s.menuOpen }));\n  closeMenu = () => this.setState({ menuOpen: false });\n\n  renderVals() {\n    const { scrollY, face, flipPhase, mouseX, mouseY, isHovered, wH, wW, sv, menuOpen } = this.state;\n\n    // ── Card sizing ───────────────────────────────────────────────────\n    const cW = Math.min(580, Math.max(260, wW * 0.84));\n    const cH = Math.round(cW / 1.75);\n    const sc = cW / 580;\n    const pV = Math.round(28 * sc);\n    const pH = Math.round(36 * sc);\n    const fnName    = Math.round(27 * sc);\n    const fnTitle   = Math.round(10.5 * sc);\n    const fnMid     = Math.round(13 * sc);\n    const fnSm      = Math.round(9.5 * sc);\n    const fnTiny    = Math.round(8.5 * sc);\n    const fnMono    = Math.round(36 * sc);\n    const fnContact = Math.round(10.5 * sc);\n    const cGap      = Math.round(10 * sc);\n    const nameGap   = Math.round(9 * sc);\n    const monoGap   = Math.round(18 * sc);\n\n    // ── Scroll reveal ────────────────────────────────────────────────\n    const sp   = Math.min(1, Math.max(0, scrollY / (wH * 0.70)));\n    const dist = Math.max(0, wH / 2 - 20 - cH / 2);\n    const ty   = -(1 - sp) * dist;\n    const wrapT = `translate(-50%, calc(-50% + ${ty.toFixed(1)}px))`;\n\n    // ── Flip angle from phase ────────────────────────────────────────\n    const phaseAngles = { 0: 0, 1: 90, 2: -90, 3: 0 };\n    const flipAngle   = phaseAngles[flipPhase] || 0;\n\n    // ── Mouse tilt (idle only) ───────────────────────────────────────\n    const isAnim = flipPhase !== 0;\n    const tX = (!isAnim && isHovered ? mouseY * -5 : 0).toFixed(2);\n    const tY = (!isAnim && isHovered ? mouseX * 5  : 0).toFixed(2);\n\n    // Perspective is in the transform itself — no preserve-3d needed\n    const card3dT = `perspective(1400px) rotateX(${tX}deg) rotateY(${(flipAngle + parseFloat(tY)).toFixed(2)}deg)`;\n    const card3dTr = flipPhase === 2\n      ? 'none'\n      : (flipPhase !== 0 ? 'transform 0.32s ease-in-out' : 'transform 0.1s linear');\n\n    // ── Shadow deepens on reveal ─────────────────────────────────────\n    const sd = sp;\n    const cShadow = [\n      `0 ${Math.round(10 + sd * 55)}px ${Math.round(24 + sd * 92)}px rgba(0,0,0,${(0.08 + sd * 0.52).toFixed(2)})`,\n      '0 4px 14px rgba(0,0,0,0.09)',\n      '0 1px 3px rgba(0,0,0,0.06)'\n    ].join(', ');\n\n    // ── Specular highlight moves with tilt ───────────────────────────\n    const lX  = (50 + (isHovered ? mouseX * 22 : 0)).toFixed(1);\n    const lY  = (36 + (isHovered ? mouseY * 15 : 0)).toFixed(1);\n    const lXB = (50 - (isHovered ? mouseX * 22 : 0)).toFixed(1);\n    const lYB = (64 - (isHovered ? mouseY * 15 : 0)).toFixed(1);\n    const specF = `radial-gradient(ellipse at ${lX}% ${lY}%, rgba(255,255,255,0.34) 0%, transparent 52%)`;\n    const specB = `radial-gradient(ellipse at ${lXB}% ${lYB}%, rgba(255,255,255,0.28) 0%, transparent 52%)`;\n\n    // ── Navigation ───────────────────────────────────────────────────\n    const navSc = scrollY > wH * 0.8;\n    const navBg  = navSc ? 'rgba(250,249,246,0.97)' : 'transparent';\n    const navBb  = navSc ? '0.5px solid rgba(26,24,22,0.1)' : '0.5px solid transparent';\n    const navTc  = navSc ? '#1c1a16' : '#c0bab0';\n    const isMobile = wW < 720;\n    const navLD  = isMobile ? 'none' : 'flex';\n    const mobBtnD = isMobile ? 'flex' : 'none';\n    const navPad = isMobile ? '16px 22px' : '20px 56px';\n    const navPadR = isMobile ? '22px' : '56px';\n    // Mobile menu overlay\n    const menuOp = menuOpen ? 1 : 0;\n    const menuPe = menuOpen ? 'auto' : 'none';\n    const menuTr = menuOpen ? 'translateY(0)' : 'translateY(-12px)';\n\n    // ── UI hints ────────────────────────────────────────────────────\n    const shO = Math.max(0, 1 - sp * 9).toFixed(2);\n    const fhO = Math.min(1, Math.max(0, (sp - 0.82) / 0.14)).toFixed(2);\n\n    // ── Face z-index: active face sits on top with solid bg, covers other ──\n    const frontZ = face === 'front' ? 2 : 1;\n    const backZ  = face === 'back'  ? 2 : 1;\n\n    // ── Section fade-ins ────────────────────────────────────────────\n    const aOp = sv.about    ? 1 : 0;\n    const aT  = `translateY(${sv.about    ? 0 : 26}px)`;\n    const pOp = sv.projects ? 1 : 0;\n    const pT  = `translateY(${sv.projects ? 0 : 26}px)`;\n    const rOp = sv.resume   ? 1 : 0;\n    const rT  = `translateY(${sv.resume   ? 0 : 26}px)`;\n    const cOp = sv.contact  ? 1 : 0;\n    const cT  = `translateY(${sv.contact  ? 0 : 26}px)`;\n\n    return {\n      cW, cH, pV, pH,\n      fnName, fnTitle, fnMid, fnSm, fnTiny, fnMono, fnContact,\n      cGap, nameGap, monoGap,\n      wrapT, card3dT, card3dTr, cShadow,\n      specF, specB,\n      frontZ, backZ,\n      flip: this.flip, onMM: this.onMM, onML: this.onML,\n      onKD: this.onKD, setRef: this.setRef,\n      navBg, navBb, navTc, navLD, navPad, navPadR,\n      mobBtnD, menuOp, menuPe, menuTr, menuOpen,\n      toggleMenu: this.toggleMenu, closeMenu: this.closeMenu,\n      shO, fhO,\n      aOp, aT, pOp, pT, rOp, rT, cOp, cT,\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"},"entry":"Portfolio.dc"}
